<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="แผงควบคุมระบบชุมชนบ้านลำพาย">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Lampai Admin</title>
</head>
<body>
  <div id="app" class="shell">
    <section id="login-view" class="login-card hidden">
      <div class="brand-mark">ล</div>
      <p class="eyebrow">LAMPAI COMMUNITY</p>
      <h1>เข้าสู่ระบบผู้ดูแล</h1>
      <p class="muted">จัดการประกาศและตรวจสถานะการสื่อสารของชุมชน</p>
      <form id="login-form" class="stack">
        <label>อีเมล<input name="email" type="email" autocomplete="username" required placeholder="you@example.com"></label>
        <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <section id="app-view" class="hidden">
      <header class="topbar">
        <div class="brand"><div class="brand-mark small">ล</div><div><strong>Lampai Admin</strong><span>ระบบชุมชนบ้านลำพาย</span></div></div>
        <div class="user-menu"><span id="mode-badge" class="badge"></span><span id="user-role"></span><button id="logout" class="ghost">ออกจากระบบ</button></div>
      </header>
      <main class="main">
        <div id="notice" class="notice hidden"></div>
        <div class="page-heading"><div><p class="eyebrow">ภาพรวมวันนี้</p><h1>ศูนย์ควบคุมชุมชน</h1><p class="muted">ดูสิ่งที่เปลี่ยนแปลงและจัดการประกาศจากที่เดียว</p></div><button id="new-announcement" class="primary">+ สร้างประกาศ</button></div>
        <nav class="tabs"><button class="tab active" data-view="dashboard">ภาพรวม</button><button class="tab" data-view="announcements">ประกาศ</button><button class="tab" data-view="deliveries">การส่ง</button><button class="tab" data-view="jobs">งานระบบ</button></nav>
        <section id="view-dashboard" class="view"></section>
        <section id="view-announcements" class="view hidden"></section>
        <section id="view-deliveries" class="view hidden"></section>
        <section id="view-jobs" class="view hidden"></section>
      </main>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
