name: jobs
# เวลา cron เป็น UTC (ไทย = UTC+7) และ GitHub อาจหน่วงได้หลายนาที — งาน CRITICAL ต้องไม่พึ่ง cron (PRD ข้อ 11)
on:
  schedule:
    - cron: '0 */3 * * *'    # weather: ทุก 3 ชม.
    - cron: '*/5 * * * *'    # tick: สำรอง — งานตามเวลาครบชุด (catch-up) ; CRITICAL ส่งทันทีตอน publish ไม่พึ่ง cron นี้
    - cron: '30 23 * * *'    # briefing เช้า 06:30 เวลาไทย
    - cron: '20 * * * *'     # healthcheck: ทุกชั่วโมง (NFR-003)
  workflow_dispatch:
    inputs:
      job:
        description: งานที่จะรัน
        type: choice
        options: [tick, weather, briefing, healthcheck]
        default: tick
      dry_run:
        description: ทดลอง (briefing แสดงผลอย่างเดียว ไม่บันทึก/ไม่ส่ง)
        type: boolean
        default: true
concurrency:
  group: lampai-jobs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      COMMUNITY_ID: ${{ vars.COMMUNITY_ID || secrets.COMMUNITY_ID }}
      LINE_TARGET: ${{ vars.LINE_TARGET || secrets.LINE_TARGET }}
      ADMIN_LINE_TARGET: ${{ secrets.ADMIN_LINE_TARGET }}   # userId/groupId ของผู้ดูแล (ไม่ใช่กลุ่มชุมชน)
      HEALTH_EXPECTED_JOBS: ${{ vars.HEALTH_EXPECTED_JOBS || secrets.HEALTH_EXPECTED_JOBS }} # เว้นว่าง = ตรวจครบ; ใช้ลดรายการบน staging
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      INPUT_JOB: ${{ inputs.job }}
      INPUT_DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: เลือกงาน
        id: pick
        run: |
          case "$EVENT_SCHEDULE" in
            "0 */3 * * *") job=weather ;;
            "30 23 * * *") job=briefing ;;
            "20 * * * *") job=healthcheck ;;
            "*/5 * * * *") job=tick ;;   # ต้องตรงกับ cron ด้านบนเป๊ะ ๆ ไม่งั้น job ว่างและไม่ทำงาน
            *) job="$INPUT_JOB" ;;
          esac
          dry=""
          if [ -z "$EVENT_SCHEDULE" ] && [ "$INPUT_DRY" = "true" ]; then dry="--dry-run"; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
      - name: ตรวจการตั้งค่า
        id: preflight
        run: scripts/preflight.sh "${{ steps.pick.outputs.job }}" "${{ github.event_name == 'schedule' }}"
      - name: weather
        if: steps.pick.outputs.job == 'weather' && steps.preflight.outputs.skip != 'true'
        run: node src/cli.ts job weather
      - name: tick
        if: steps.pick.outputs.job == 'tick' && steps.preflight.outputs.skip != 'true'
        run: node src/cli.ts job tick ${{ steps.pick.outputs.dry }}
      - name: briefing
        if: steps.pick.outputs.job == 'briefing' && steps.preflight.outputs.skip != 'true'
        run: |
          node src/cli.ts job briefing --slot morning ${{ steps.pick.outputs.dry }}
          node src/cli.ts job dispatch ${{ steps.pick.outputs.dry }}
      - name: healthcheck
        if: steps.pick.outputs.job == 'healthcheck' && steps.preflight.outputs.skip != 'true'
        run: node src/cli.ts job healthcheck ${{ steps.pick.outputs.dry }}
